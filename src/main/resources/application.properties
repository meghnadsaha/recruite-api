# ========================
# Application Information
# ========================
spring.application.name=Recruite Application

# ========================
# Server Configuration
# ========================
server.port=8080

# ========================
# Database Configuration
# ========================
# PostgreSQL database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate dialect for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Automatically create/drop schema at startup
spring.jpa.hibernate.ddl-auto=create-drop

# Enable JPA SQL logging for debugging
spring.jpa.show-sql=true

# ========================
# H2 Console Settings
# ========================
# Uncomment to use H2 database instead of PostgreSQL
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.datasource.url=jdbc:h2:~/recruitment;MODE=MySQL;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=sa
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.settings.auth-mode=DISABLED

# ========================
# Security Configuration
# ========================
# Default in-memory user for basic authentication
spring.security.user.name=admin
spring.security.user.password=admin123
# Uncomment to set default roles
# spring.security.user.roles=USER

# ========================
# Logging Configuration
# ========================
# Logging levels for application
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.recruitment.service=DEBUG

# ========================
# Enable JPA debug logging for Hibernate
# ========================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# ========================
# OpenAPI/Swagger Configuration
# ========================
bezkoder.openapi.dev-url=http://localhost:8080
bezkoder.openapi.prod-url=https://www.google.com



# ========================
# Configure Mail Properties
# ========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
